server {
    listen 80;
    root /usr/share/nginx/html;

    # Deliberately no custom `types {}` block here: nginx's own
    # /etc/nginx/mime.types (included by the base image's nginx.conf at the
    # http level) already maps .wasm to application/wasm. Redeclaring a
    # types {} block in this server context would REPLACE that inherited
    # map instead of extending it, leaving every other extension - .html,
    # .js, .css - falling back to application/octet-stream and making the
    # browser download the site instead of rendering it.

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # index.html references the current build's fingerprinted _framework/*
    # filenames, so it must never be served from the browser's disk cache -
    # a stale cached index.html can point at asset hashes from a previous
    # image. (This is also what let a stale cached response - including a
    # wrong Content-Type from a previous nginx config - keep getting reused
    # across redeploys instead of being re-fetched.)
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
